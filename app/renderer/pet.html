<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>AI Copilot 桌宠</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none; cursor: default; }
  #pet { width: 190px; height: 250px; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; position: relative; }

  #bubble { max-width: 176px; margin: 0 6px 6px; padding: 7px 11px; border-radius: 12px;
    background: rgba(28, 30, 38, 0.90); color: #fff; font-size: 12px; line-height: 1.45;
    text-align: center; word-break: break-word; box-shadow: 0 4px 14px rgba(0,0,0,0.22);
    opacity: 0; transform: translateY(4px); transition: opacity .22s ease, transform .22s ease; }
  #bubble.show { opacity: 1; transform: translateY(0); }
  #bubble.hidden-ui { display: none; }

  #char-wrap { width: 150px; height: 150px; display: flex; align-items: flex-end;
    justify-content: center; position: relative; }
  #char { width: 128px; height: 128px; transform-origin: 50% 100%; }
  #char img { width: 128px; height: 128px; object-fit: contain; }

  /* 状态动画 */
  #char-wrap.idle #char   { animation: breathe 2.8s ease-in-out infinite; }
  #char-wrap.thinking #char { animation: bob 1.1s ease-in-out infinite; }
  #char-wrap.working #char  { animation: work 0.62s ease-in-out infinite; }
  #char-wrap.question #char { animation: tilt 1.5s ease-in-out infinite; }
  #char-wrap.done #char     { animation: pop 0.5s ease-out 1; }
  @keyframes breathe { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-3px) scale(1.015); } }
  @keyframes bob     { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-5px) rotate(2deg); } }
  @keyframes work    { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(4deg); } }
  @keyframes tilt    { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @keyframes pop     { 0% { transform: scale(1); } 40% { transform: scale(1.14); } 100% { transform: scale(1); } }

  #badge { position: absolute; top: 2px; right: 14px; min-width: 22px; height: 22px;
    padding: 0 6px; border-radius: 11px; background: #2f6fed; color: #fff;
    font-size: 12px; line-height: 22px; text-align: center; font-weight: 600;
    box-shadow: 0 2px 8px rgba(47,111,237,0.45); opacity: 0; transition: opacity .2s ease; }
  #badge.show { opacity: 1; }
  #badge.q { background: #f5a623; }
  #badge.d { background: #1a7f37; }
</style>
</head>
<body>
<div id="pet">
  <div id="bubble"></div>
  <div id="char-wrap" class="idle">
    <div id="badge"></div>
    <div id="char"></div>
  </div>
</div>

<script src="pet-characters.js"></script>
<script>
  const bubble = document.getElementById('bubble');
  const wrap = document.getElementById('char-wrap');
  const charEl = document.getElementById('char');
  const badge = document.getElementById('badge');
  let bubbleTimer = null;
  let doneTimer = null;
  let currentChar = 'fox';
  let bubbleEnabled = true;

  function renderCharacter(key, customImage) {
    currentChar = key || 'fox';
    if (customImage) {
      charEl.innerHTML = '<img src="file://' + customImage + '" alt="pet" />';
      return;
    }
    const def = window.PET_CHARACTERS && window.PET_CHARACTERS[currentChar] ? window.PET_CHARACTERS[currentChar] : window.PET_CHARACTERS.fox;
    charEl.innerHTML = '<svg viewBox="0 0 120 110" width="128" height="128">' + def.render() + '</svg>';
  }

  function showBubble(text) {
    if (!bubbleEnabled) { bubble.classList.remove('show'); return; }
    bubble.textContent = text || '';
    bubble.classList.add('show');
    clearTimeout(bubbleTimer);
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 5200);
  }

  const BADGE = { thinking: { t: '···', c: '' }, working: { t: '⚙', c: '' }, question: { t: '?', c: 'q' }, done: { t: '✓', c: 'd' } };

  function setStatus(status, text) {
    wrap.className = status || 'idle';
    const b = BADGE[status];
    if (b) {
      badge.textContent = b.t;
      badge.className = 'show ' + b.c;
    } else {
      badge.className = '';
    }
    if (text) showBubble(text);
    if (status === 'done') {
      clearTimeout(doneTimer);
      doneTimer = setTimeout(() => { wrap.className = 'idle'; badge.className = ''; }, 2600);
    }
  }

  window.pet.onConfig((c) => {
    bubbleEnabled = c.bubbleEnabled !== false;
    bubble.classList.toggle('hidden-ui', !bubbleEnabled);
    renderCharacter(c.character, c.customImage);
    document.body.style.cursor = c.clickThrough ? 'default' : 'grab';
  });

  window.pet.onState((s) => setStatus(s.status, s.text));

  /* 拖动（关闭「鼠标穿透」时可用） */
  let dragging = false;
  let last = null;
  charEl.addEventListener('mousedown', (e) => {
    if (document.body.style.cursor === 'default') return;
    dragging = true; last = { x: e.screenX, y: e.screenY };
    document.body.style.cursor = 'grabbing';
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging || !last) return;
    const dx = e.screenX - last.x;
    const dy = e.screenY - last.y;
    if (dx || dy) { window.pet.move(dx, dy); last = { x: e.screenX, y: e.screenY }; }
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; last = null;
    document.body.style.cursor = 'grab';
    window.pet.moveEnd();
  });

  renderCharacter('fox');
</script>
</body>
</html>
