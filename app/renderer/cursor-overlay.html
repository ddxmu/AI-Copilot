<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cursor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
    }
    #cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 40px;
      height: 40px;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      transition: transform 0.06s linear, opacity 0.25s ease;
      opacity: 0;
      z-index: 999999;
    }
    #cursor img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.25));
    }
    #cursor.visible { opacity: 1; }
    .ripple {
      position: absolute;
      left: 0;
      top: 0;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 3px solid rgba(255, 75, 120, 0.9);
      background: rgba(255, 75, 120, 0.14);
      box-shadow: 0 0 14px rgba(255, 75, 120, 0.55);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: ripple 0.48s ease-out forwards;
      z-index: 999998;
    }
    @keyframes ripple {
      0% { width: 16px; height: 16px; opacity: 1; }
      100% { width: 84px; height: 84px; opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="cursor" role="presentation" aria-hidden="true">
    <img src="cursor.png" alt="" draggable="false">
  </div>
  <script>
    (function () {
      const cursor = document.getElementById('cursor');
      let visible = false;
      function setPos(x, y) {
        cursor.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        if (!visible) {
          cursor.classList.add('visible');
          visible = true;
        }
      }
      function addRipple(x, y) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = x + 'px';
        r.style.top = y + 'px';
        document.body.appendChild(r);
        setTimeout(() => {
          try { r.remove(); } catch (e) {}
        }, 520);
      }
      if (window.api) {
        window.api.cursorMove((d) => setPos(d.x, d.y));
        window.api.cursorAction((d) => {
          if (d.x != null && d.y != null) setPos(d.x, d.y);
          if (d.a === 'click' || d.a === 'down') addRipple(d.x, d.y);
        });
        window.api.cursorShow(() => {
          cursor.classList.add('visible');
          visible = true;
        });
        window.api.cursorHide(() => {
          cursor.classList.remove('visible');
          visible = false;
        });
      }
    })();
  </script>
</body>
</html>
