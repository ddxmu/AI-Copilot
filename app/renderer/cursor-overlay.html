<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Cursor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-app-region: no-drag;
    }
    /* 鼠标指针：容器 ≈17px，使 200x200 内的箭头缩放到约 16px（清晰可见，符合 14~18px 要求）。
       仅调整视觉尺寸，不影响任何坐标换算。 */
    #cursor {
      position: absolute;
      left: 0;
      top: 0;
      width: 17px;
      height: 17px;
      pointer-events: none;
      will-change: transform, opacity;
      transform: translate3d(0, 0, 0);
      /* 保留移动可视动画（平滑过渡） */
      transition: transform 0.06s linear, opacity 0.25s ease;
      opacity: 0;
      z-index: 999999;
    }
    #cursor img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      filter: drop-shadow(1px 2px 2px rgba(0, 0, 0, 0.35));
    }
    #cursor.visible { opacity: 1; }
    /* 点击反馈红圈：直径 ~36px（32~40px 区间），线宽 2.5px，显示约 300~500ms 后淡出。
       中心透明，不遮挡下方内容。 */
    .ripple {
      position: absolute;
      left: 0;
      top: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2.5px solid rgba(255, 75, 120, 0.95);
      background: transparent;
      box-shadow: 0 0 10px rgba(255, 75, 120, 0.4);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: ripple 0.48s ease-out forwards;
      z-index: 999998;
    }
    @keyframes ripple {
      0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.85); }
      12%  { opacity: 1;    transform: translate(-50%, -50%) scale(1); }
      65%  { opacity: 1;    transform: translate(-50%, -50%) scale(1.05); }
      100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.1); }
    }
  </style>
</head>
<body>
  <div id="cursor" role="presentation" aria-hidden="true">
    <img src="cursor.png" alt="" draggable="false">
  </div>
  <script>
    (function () {
      const cursor = document.getElementById('cursor');
      let visible = false;
      // cursor.png (200x200) 的可见箭头尖端（最左上不透明像素）实测在 (21, 13)。
      // 17x17 容器内缩放比为 17/200=0.085，故尖端在容器内约 (1.8, 1.1)。
      // 把容器左上角往左/上偏移同样距离，让尖端与目标坐标重合。
      // 仅视觉偏移，不改动任何坐标换算。
      const TIP_OFFSET_X = 1.8;
      const TIP_OFFSET_Y = 1.1;
      function setPos(x, y) {
        cursor.style.transform = `translate3d(${x - TIP_OFFSET_X}px, ${y - TIP_OFFSET_Y}px, 0)`;
        if (!visible) {
          cursor.classList.add('visible');
          visible = true;
        }
      }
      function addRipple(x, y) {
        const r = document.createElement('div');
        r.className = 'ripple';
        r.style.left = x + 'px';
        r.style.top = y + 'px';
        document.body.appendChild(r);
        setTimeout(() => {
          try { r.remove(); } catch (e) {}
        }, 520);
      }
      if (window.api) {
        window.api.cursorMove((d) => setPos(d.x, d.y));
        window.api.cursorAction((d) => {
          if (d.x != null && d.y != null) setPos(d.x, d.y);
          if (d.a === 'click' || d.a === 'down') addRipple(d.x, d.y);
        });
        window.api.cursorShow(() => {
          cursor.classList.add('visible');
          visible = true;
        });
        window.api.cursorHide(() => {
          cursor.classList.remove('visible');
          visible = false;
        });
      }
    })();
  </script>
</body>
</html>
